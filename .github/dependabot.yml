version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    # Stable release: resume version proposals for a coordinated toolchain migration.
    # Security update PRs have a separate limit and remain enabled.
    open-pull-requests-limit: 0
    groups:
      kotlin-plugins:
        patterns:
          - "org.jetbrains.kotlin*"
      android-ui:
        patterns:
          - "androidx.compose*"
          - "androidx.graphics*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      ci-actions:
        patterns:
          - "*"
