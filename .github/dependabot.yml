version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      kotlin-plugins:
        patterns:
          - "org.jetbrains.kotlin*"
      android-ui:
        patterns:
          - "androidx.compose*"
          - "androidx.graphics*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      ci-actions:
        patterns:
          - "*"
