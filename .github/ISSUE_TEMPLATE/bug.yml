name: Bug report
description: Report an issue with the public edition
body:
  - type: markdown
    attributes:
      value: 'Do not attach credentials, personal media or private server URLs. Security issues belong in private vulnerability reporting.'
  - type: input
    id: version
    attributes:
      label: App version and Android TV version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
